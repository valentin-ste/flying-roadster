<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Roadster show</title>
<style>
  /* The show window is transparent (Tauri transparent: true + WebView2's background clear): nothing here may paint a
     background. The window has the frame's proportions; the video fills it whole, standing on its bottom edge. */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%;
          background: transparent; pointer-events: none; }
</style>
</head>
<body>
<video id="v" preload="auto" playsinline disablepictureinpicture></video>
<script src="show.js"></script>
</body>
</html>
